name: auth_bruteforce
id: LS-C-2
type: correlation_rule
version: 1.0.0
title: A series of failed authentications
severity: high
tactic: credential_access
technique: T1110
category: authentication
enabled: true
# One failed attempt is a typo. Five in five minutes from one subject is either
# password guessing or a broken automated client. Both need to be seen.
#
# EXCLUDE non-interactive sudo (sudo -n): "conversation failed" / "could not
# identify password" / "a password is required" mean NO password was ever tried
# - it is a privilege PROBE, not guessing (our own collection runs `sudo -n`
# constantly). Counting those produced false "bruteforce" alerts for `local`.
where: >-
  event_category = 'authentication' AND event_outcome = 'failure'
  AND message NOT LIKE '%conversation failed%'
  AND message NOT LIKE '%could not identify password%'
  AND message NOT LIKE '%a password is required%'
group_by: [subject_name]
threshold: 5
window: 300
message: "{count} failed authentications in a row for {subject_name}"
