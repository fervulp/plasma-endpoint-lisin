name: aggregate_events
id: LS-E-35
type: enrichment
version: 1.0.0
title: Collapse repetitive eBPF events into one aggregate
# WHY: after the collector drops the agent's own cgroup, what is left is external
# but still repetitive - a service or app doing the SAME thing hundreds of times a
# minute (polkit auth checks, a scanner touching its files). Recording each one
# buries the timeline and fills retention. This collapses a run of identical
# events into ONE event with event_kind=aggregate and event_count=N, so "N times"
# is visible without N rows. Groups below the threshold stay as individuals - a
# rare event is never hidden. Only eBPF is aggregated (its volume is the problem);
# other modules pass through untouched.
#
# The signature groups by module+action+actor+object_type and a NUMBER-NORMALIZED
# object, so "state.tmp.123" and "state.tmp.456" fall into the same group. The
# aggregate keeps the newest timestamp and names the window in its message.
code: |
  import re, hashlib
  from collections import defaultdict

  THRESHOLD = 5          # a run of >= this many identical events collapses to one

  def _sig(r):
      who = r.get("process_name", "") or r.get("subject_name", "")
      if r.get("event_category") == "file":
          # a burst of writes into the SAME directory collapses into one - "app X
          # touched N files under dir D" is the signal, not each filename.
          obj = "dir:" + r.get("file_directory", "")
      else:
          obj = (r.get("object_name", "") or r.get("destination_ip", ""))
          obj = re.sub(r"\d+", "#", str(obj))      # collapse numeric variance
      return (r.get("event_module", ""), r.get("event_action", ""),
              str(who), r.get("object_type", ""), obj)

  def enrich(rows):
      groups = defaultdict(list)
      order = []                                    # preserve first-seen order
      for r in rows:
          if r.get("event_module") != "ebpf":
              order.append(("keep", r))
              continue
          k = _sig(r)
          if k not in groups:
              order.append(("grp", k))
          groups[k].append(r)

      out = []
      for kind, item in order:
          if kind == "keep":
              out.append(item)
              continue
          g = groups.get(item)
          if not g:                                 # already emitted
              continue
          groups[item] = None
          if len(g) < THRESHOLD:
              out.extend(g)                         # small group: keep every one
              continue
          base = dict(g[-1])                        # newest event as the template
          tss = sorted(r.get("ts", "") for r in g if r.get("ts"))
          first = tss[0] if tss else ""
          last = tss[-1] if tss else base.get("ts", "")
          who = base.get("process_name", "") or base.get("subject_name", "")
          act = base.get("event_action", "")
          base["event_kind"] = "aggregate"
          base["event_count"] = str(len(g))
          base["ts"] = last
          base["message"] = "%s x%d (%s..%s)" % (
              (who + " " + act).strip(), len(g),
              first[11:19] if len(first) >= 19 else first,
              last[11:19] if len(last) >= 19 else last)
          # stable id per (signature, minute): overlapping ticks dedup, a new
          # minute makes a new aggregate (INSERT OR IGNORE on event_id)
          sid = hashlib.sha1(("|".join(map(str, item))).encode()).hexdigest()[:12]
          base["event_id"] = "agg:%s:%s" % (sid, last[:16])
          out.append(base)
      return out
