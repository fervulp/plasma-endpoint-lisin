name: logins
table: logins
type: input
version: 1.0.0
title: Login history
icon: system-log-out
# History, not a live snapshot: it changes a few times a day, so re-reading the
# whole of wtmp every 30 s would be work for nothing. "Who is logged in NOW" is
# the sessions input, which does run on the default tick.
interval: 120
# where this table sits in the reading order of the Data section
# (lower comes first); a rule without one sorts after these.
priority: 120
# The fields worth reading FIRST in this table; everything else the
# source produces stays available in the Columns panel.
columns: [time_utc, action, username, tty, origin, host, session_sec, ago_sec]
description: >
  Login history from wtmp — both ends of each session: a login record and the
  record that closes it. The whole file is read each run (1515 records here,
  0.36 s); how far back that reaches is decided by logrotate, not by us, and
  anything already rotated away is simply not in wtmp any more.
# Collection belongs to the input, so a history row reads as a sentence instead of
# a raw utmp struct:
#   * action      - login / logout, from the record's own type (wtmp writes
#                   USER_PROCESS when a session opens and DEAD_PROCESS when the
#                   line is released). An unknown type passes through under its own
#                   name rather than being forced into one of the two;
#   * uid         - the account resolved (JOIN users). Empty when the name no longer
#                   exists, which for a login record is itself worth seeing;
#   * origin      - local console / X display / remote, derived from the row's own
#                   host field, and only for login records — a logout record leaves
#                   host empty, so calling it "local" would be a false fact;
#   * time_utc    - the epoch rendered readable, next to the raw time that stays
#                   sortable in SQL; ago_sec is how long ago it happened;
#   * session_sec - how long the session lasted. Paired by tty in time order: a
#                   login counts only when the very next record on the same line is
#                   its logout. The pid on a DEAD_PROCESS record does NOT match the
#                   login's pid (verified on live wtmp), so pid pairing would be
#                   wrong; a session with no closing record is left EMPTY rather
#                   than guessed. Checked on 1515 live records: 672 pairs, no
#                   negative durations, 160 logins honestly unpaired.
query: |
  WITH w AS (
    SELECT
      username, tty, host, time, pid, type_name,
      LEAD(time)      OVER (PARTITION BY tty ORDER BY time, pid) AS next_time,
      LEAD(type_name) OVER (PARTITION BY tty ORDER BY time, pid) AS next_type
    FROM last
  )
  SELECT
    w.username,
    u.uid,
    CASE
      WHEN w.type_name = 'user-process' THEN 'login'
      WHEN w.type_name = 'dead-process' THEN 'logout'
      ELSE w.type_name
    END                                        AS action,
    w.tty,
    w.host,
    CASE
      WHEN w.type_name <> 'user-process' THEN ''
      WHEN w.host = '' OR w.host IS NULL  THEN 'local'
      WHEN w.host LIKE ':%'               THEN 'display'
      ELSE 'remote'
    END                                        AS origin,
    w.time,
    datetime(w.time, 'unixepoch')              AS time_utc,
    (strftime('%s','now') - w.time)            AS ago_sec,
    CASE
      WHEN w.type_name = 'user-process' AND w.next_type = 'dead-process'
        THEN w.next_time - w.time
    END                                        AS session_sec,
    w.pid
  FROM w
  LEFT JOIN users u ON u.username = w.username
  ORDER BY w.time DESC, w.tty, w.pid
