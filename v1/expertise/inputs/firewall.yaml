name: firewall
table: firewall
type: input
kind: command
version: 2.0.0
title: Firewall
icon: security-medium
interval: 300
priority: 110
columns: [zone, kind, value, target, interfaces, active, default_zone]
description: >-
  What the firewall actually permits, read from the firewall this machine runs.
  It used to read osquery's `iptables` table and returned ZERO rows: Fedora
  filters through firewalld over nftables, and the legacy iptables chains that
  table reads are empty. A firewall tab that says nothing is worse than no tab —
  it reads as "nothing is open".
  ONLY THE ZONES IN USE. firewalld ships about fifteen predefined zones and a
  machine typically uses two; listing all of them buries the two that decide
  anything. So the active zones (those with an interface or source bound to
  them) and the default zone are read, and each permitted port, service,
  protocol, forwarded port, masquerade and rich rule becomes one row.
  The nftables ruleset underneath needs root and is not read here; what firewalld
  reports is the configuration that produced it.
tsv_columns: [zone, kind, value, target, interfaces, active, default_zone]
tests:
  min_rows: 1
  not_empty: [zone, kind, value]
  expect:
    - name: the zone in charge of an interface is known
      where: "kind = 'interface'"
      min_rows: 1
command: |
  export LC_ALL=C
  command -v firewall-cmd >/dev/null || exit 0
  systemctl is-active --quiet firewalld || exit 0
  # ONE call per zone: --list-all prints every setting at once (--get-target and
  # friends only work with --permanent, and a call per setting cost 4.9 s).
  DEF=$(firewall-cmd --get-default-zone 2>/dev/null)
  ACT=$(firewall-cmd --get-active-zones 2>/dev/null | grep -v '^ ' | sed 's/ .*//')
  for z in $(printf '%s\n%s\n' "$ACT" "$DEF" | sort -u | grep -v '^$'); do
    firewall-cmd --zone="$z" --list-all 2>/dev/null
    echo "===ZONE-END==="
  done | awk -F: '
    # Every setting that PERMITS something becomes its own row; the settings that
    # merely describe the zone (target, interfaces, active, default) ride along on
    # each of its rows, so one row is readable on its own.
    function emit(kind, value) {
      if (value == "") return
      printf "%s\t%s\t%s\t%s\t%s\t%s\t%s\n", zone, kind, value, target, ifaces, active, isdef
    }
    function flush_lists(  i, n, parts) {
      for (key in list) {
        n = split(list[key], parts, " ")
        for (i = 1; i <= n; i++) emit(kindof[key], parts[i])
      }
      delete list
    }
    /^[^ \t]/ && $0 !~ /^===/ {
      if (zone != "") { flush_lists(); }
      zone = $0; sub(/[ \t].*/, "", zone)   # the header line is "<zone> (default, active)"
      active = (index($0, "active") ? "yes" : "")
      isdef  = (index($0, "default") ? "yes" : "")
      target = ""; ifaces = ""
      next
    }
    /^===ZONE-END===/ {
      if (zone != "") { emit("zone", "target " (target == "" ? "default" : target)); flush_lists() }
      zone = ""; next
    }
    /^  [a-z-]+:/ {
      key = $1; sub(/^  */, "", key); sub(/:.*/, "", key)
      val = $0; sub(/^  [a-z-]+:[ \t]*/, "", val)
      if (key == "target") { target = val }
      else if (key == "interfaces") { ifaces = val; list[key] = val }
      else if (key == "services" || key == "ports" || key == "protocols" ||
               key == "sources" || key == "forward-ports" ||
               key == "source-ports" || key == "icmp-blocks" ||
               key == "rich" ) { list[key] = val }
      else if ((key == "masquerade" || key == "forward") && val == "yes") { list[key] = "yes" }
      next
    }
    BEGIN {
      kindof["services"] = "service"; kindof["ports"] = "port"
      kindof["protocols"] = "protocol"; kindof["sources"] = "source"
      kindof["forward-ports"] = "forward"; kindof["source-ports"] = "source port"
      kindof["icmp-blocks"] = "icmp block"; kindof["interfaces"] = "interface"
      kindof["masquerade"] = "masquerade"; kindof["forward"] = "forward"
    }
  '
