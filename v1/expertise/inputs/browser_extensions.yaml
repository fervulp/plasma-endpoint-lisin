name: browser_extensions
table: browser_extensions
type: input
version: 1.0.0
title: Browser extensions
icon: internet-web-browser
# Extension inventory changes on install/update, not second by second, so this
# input declares its own interval instead of re-reading every profile on the
# 30 s process tick.
interval: 300
# where this table sits in the reading order of the Data section
# (lower comes first); a rule without one sorts after these.
priority: 180
# The fields worth reading FIRST in this table; everything else the
# source produces stays available in the Columns panel.
columns: [browser, user, name, version, status, kind, author, identifier]
description: >
  Browser add-ons from every account: chromium-family extensions and Firefox
  add-ons unioned into one table with a `browser` column. HONEST LIMITS.
  (1) osquery only walks the standard profile roots — ~/.mozilla/firefox and the
  chromium-family directories under ~/.config; a fork that keeps its own profile
  root (Zen, LibreWolf, Waterfox) and a flatpak-sandboxed browser under
  ~/.var/app are NOT seen, so an empty side means "nothing in the standard
  paths", not "nothing installed". (2) The collector runs as a normal user, so
  only that user's profiles are readable — other accounts are enumerated by the
  users join but come back empty without root. (3) Firefox exposes no permission
  list, so `permissions` is populated for the chromium side only.
# Collection belongs to the input, so the two very different source tables are
# reconciled HERE, not later:
#   * per-user by construction - both tables are keyed by uid, so the users join
#     covers every account and turns the bare uid into a username;
#   * status  - one readable verdict from each table's own flags (chromium has a
#     single `state`, Firefox splits it across active/disabled). The raw flags
#     are kept beside it so nothing is lost;
#   * from_store - chromium's from_webstore normalised to yes/no; the CASE falls
#     back to the raw value rather than guessing when it is anything else;
#   * a flag a table does not offer stays EMPTY (visible/active/disabled are
#     Firefox-only, persistent/referenced/permissions are chromium-only) - an
#     empty cell is honest, an invented default would not be.
query: |
  SELECT
    CASE WHEN c.browser_type = '' THEN 'chrome' ELSE c.browser_type END       AS browser,
    u.username                AS user,
    c.uid                     AS uid,
    c.name                    AS name,
    c.identifier              AS identifier,
    c.version                 AS version,
    'extension'               AS kind,
    CASE c.state WHEN '1' THEN 'enabled'
                 WHEN '0' THEN 'disabled'
                 ELSE c.state END                                             AS status,
    c.author                  AS author,
    c.description             AS description,
    c.permissions             AS permissions,
    c.optional_permissions    AS optional_permissions,
    CASE lower(c.from_webstore) WHEN 'true' THEN 'yes'
                                WHEN 'false' THEN 'no'
                                ELSE c.from_webstore END                      AS from_store,
    c.persistent              AS persistent,
    ''                        AS visible,
    ''                        AS active,
    ''                        AS disabled,
    ''                        AS autoupdate,
    c.referenced              AS referenced,
    c.path                    AS path,
    ''                        AS location,
    c.profile                 AS profile,
    c.update_url              AS source_url,
    c.install_time            AS install_time
  FROM users u
  JOIN chrome_extensions c ON c.uid = u.uid
  UNION ALL
  SELECT
    'firefox',
    u.username,
    f.uid,
    f.name,
    f.identifier,
    f.version,
    f.type,
    CASE WHEN f.disabled = 1 THEN 'disabled'
         WHEN f.active = 1   THEN 'enabled'
         ELSE 'inactive' END,
    f.creator,
    f.description,
    '',
    '',
    '',
    '',
    f.visible,
    f.active,
    f.disabled,
    f.autoupdate,
    '',
    f.path,
    f.location,
    '',
    f.source_url,
    ''
  FROM users u
  JOIN firefox_addons f ON f.uid = u.uid
  ORDER BY browser, uid, name, identifier, version
